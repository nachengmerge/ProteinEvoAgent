[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinevoagent"
version = "0.3.0"
description = "Report-aligned GB1 fitness predictor and Llama scientific Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "psutil>=5.9,<8", "joblib>=1.3,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
neural = ["torch>=2.3,<3"]
local_llm = ["llama-cpp-python>=0.3,<0.4"]

[project.scripts]
proteinevo = "proteinevo.delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
